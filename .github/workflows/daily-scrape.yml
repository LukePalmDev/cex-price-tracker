name: 🎮 Daily CEX Scraping

on:
  schedule:
    # 4 volte al giorno: 01:00 / 07:00 / 13:00 / 19:00 ora italiana (CET=UTC+1)
    # → 00:00 / 06:00 / 12:00 / 18:00 UTC (inverno) | -1h in estate (CEST=UTC+2)
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'

  # Permette esecuzione manuale dalla tab Actions
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installa dipendenze (solo requests — no Chrome, no Selenium)
      - name: 📦 Install dependencies
        run: pip install requests

      # 3.5. Scarica database da GitHub Release (se esiste)
      - name: 💾 Download current database
        run: |
          mkdir -p data/current
          gh release download database -p "games.db" --clobber || echo "Nessun database trovato nella release, verrà creato uno nuovo"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Esegui scraper
      - name: 🤖 Run CEX scraper
        run: |
          cd scraper
          python main_scraper.py
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          PYTHONUNBUFFERED: 1

      # 5. Commit report e metadati (escluso games.db)
      - name: 💾 Commit reports & dashboard data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/reports/ dashboard/data/
          git diff --staged --quiet || git commit -m "🤖 Scrape: $(date +'%Y-%m-%d %H:%M')"
          git push

      # 6. Carica database aggiornato su GitHub Release
      - name: 📤 Upload database to release
        run: |
          # Crea la release se non esiste
          gh release create database --notes "Database storico CEX Price Tracker" || true
          # Carica il file games.db (sovrascrive se già presente)
          gh release upload database data/current/games.db --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
