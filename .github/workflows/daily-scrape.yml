name: 🎮 Daily CEX Scraping

on:
  schedule:
    # 4 volte al giorno: 01:00 / 07:00 / 13:00 / 19:00 ora italiana (CET=UTC+1)
    # → 00:00 / 06:00 / 12:00 / 18:00 UTC (inverno) | -1h in estate (CEST=UTC+2)
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'

  # Permette esecuzione manuale dalla tab Actions
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Python
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installa dipendenze (requests — no Chrome, no Selenium)
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # 3.5. Scarica database da GitHub Release (se esiste)
      - name: 💾 Download current database
        run: |
          mkdir -p data/current
          # gh scarica nella cwd se non si passa --dir. Senza --dir il file
          # finiva nella root del repo e lo scraper ricreava un DB vuoto a
          # ogni run (niente storico, tutto segnato come "nuovo").
          if gh release view database >/dev/null 2>&1; then
            gh release download database --pattern "games.db" --clobber --dir data/current
          else
            echo "Nessuna release 'database': ne verrà creata una nuova"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Esegui scraper. Una risposta CeX non-JSON (blocco transitorio)
      # viene ritentata con backoff; se resta non-JSON il job esce 0
      # con un warning e non aggiorna dati, così un run isolato non fallisce.
      - name: 🤖 Run CEX scraper
        id: scrape
        run: |
          cd scraper
          attempt=1
          max_attempts=3
          wait_s=20
          while [ "$attempt" -le "$max_attempts" ]; do
            set +e
            python main_scraper.py 2>&1 | tee /tmp/cex-scrape.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if grep -q "Errore curl dopo .* tentativi: risposta non JSON" /tmp/cex-scrape.log; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "::warning title=CeX response was not JSON::Attempt ${attempt}/${max_attempts} did not get JSON from CeX. Retrying in ${wait_s}s."
                sleep "$wait_s"
                wait_s=$((wait_s * 2))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::warning title=CeX response was not JSON::CeX still did not return JSON after ${max_attempts} attempts. Skipping this run so a transient block does not fail the job."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$code"
          done
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          PYTHONUNBUFFERED: 1

      # 5. Commit report e metadati (escluso games.db)
      - name: 💾 Commit reports & dashboard data
        if: steps.scrape.outputs.skipped != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/reports/ dashboard/data/
          git diff --staged --quiet || git commit -m "🤖 Scrape: $(date +'%Y-%m-%d %H:%M')"
          git push

      # 6. Carica database aggiornato su GitHub Release
      - name: 📤 Upload database to release
        if: steps.scrape.outputs.skipped != 'true'
        run: |
          # Crea la release se non esiste
          gh release create database --notes "Database storico CEX Price Tracker" || true
          # Carica il file games.db (sovrascrive se già presente)
          gh release upload database data/current/games.db --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
