name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Working tree only. History is not rewritten, and older commits are
      # outside this check.
      - name: Install gitleaks
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks.sha256
          (cd /tmp && sha256sum --check --ignore-missing gitleaks.sha256)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --verbose
