name: 📦 Monthly Snapshot Backup

on:
  schedule:
    # Primo giorno di ogni mese alle 01:00 UTC
    - cron: '0 1 1 * *'

  # Permette esecuzione manuale
  workflow_dispatch:

jobs:
  monthly-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Download current database
        run: |
          mkdir -p data/current
          gh release download database -p "games.db" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📸 Create monthly snapshot
        run: |
          python scripts/monthly_snapshot.py
        env:
          PYTHONUNBUFFERED: 1

      - name: 💾 Commit snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history/
          git diff --staged --quiet || git commit -m "📦 Monthly snapshot: $(date +'%Y-%m')"
          git push
